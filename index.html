<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>개인정보 입력</title>
<style>
  :root{
    --purple:#673AB7;
    --purple-dark:#5e35b1;
    --bg:#f4f3fb;
    --card:#ffffff;
    --border:#dadce0;
    --text:#202124;
    --muted:#5f6368;
    --danger:#d93025;
    --success:#1e8e3e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .wrap{ max-width:640px; margin:40px auto 60px; padding:0 16px; }
  .header-bar{ height:10px; background:linear-gradient(90deg, var(--purple), #9575cd); border-radius:8px 8px 0 0; }
  .card{ background:var(--card); border:1px solid var(--border); border-top:none; border-radius:0 0 8px 8px; padding:28px 24px; margin-bottom:16px; }
  .card.title-card{ border-top:1px solid var(--border); border-radius:8px; border-left:6px solid var(--purple); }
  h1{ font-size:22px; margin:0 0 8px; }
  .desc{ font-size:14px; color:var(--muted); line-height:1.5; margin:0; }
  .field-card{ background:var(--card); border:1px solid var(--border); border-radius:8px; padding:20px 24px; margin-bottom:16px; }
  label.field-label{ display:block; font-size:14px; margin-bottom:10px; font-weight:500; }
  label.field-label .req{ color:var(--danger); margin-left:2px; }
  input[type=text], input[type=tel]{ width:100%; padding:8px 4px; font-size:15px; border:none; border-bottom:1px solid var(--border); outline:none; background:transparent; color:var(--text); }
  input[type=text]:focus, input[type=tel]:focus{ border-bottom:2px solid var(--purple); padding-bottom:7px; }
  .disabled-field{ background:#f8f8f8; padding:8px 10px; border-radius:4px; color:var(--muted); font-size:15px; border:1px solid #eee; }
  .date-row{ display:flex; gap:10px; }
  .date-row select{ flex:1; padding:9px 6px; font-size:14px; border:1px solid var(--border); border-radius:4px; background:white; color:var(--text); }
  .date-labels{ display:flex; gap:10px; margin-top:4px; }
  .date-labels span{ flex:1; text-align:center; font-size:11px; color:var(--muted); }
  .error-msg{ color:var(--danger); font-size:12px; margin-top:6px; display:none; }
  .field-card.invalid input, .field-card.invalid select{ border-color:var(--danger) !important; }
  .field-card.invalid .error-msg{ display:block; }
  .submit-row{ display:flex; justify-content:flex-end; align-items:center; gap:12px; padding:0 4px; }
  .submit-btn{ background:var(--purple); color:white; border:none; padding:10px 28px; font-size:14px; border-radius:6px; cursor:pointer; font-weight:500; }
  .submit-btn:hover{ background:var(--purple-dark); }
  .submit-btn:disabled{ background:#b7a6d9; cursor:not-allowed; }
  .status-msg{ font-size:13px; color:var(--muted); }
  .done-screen{ text-align:center; padding:60px 24px; }
  .done-screen .check{ width:56px;height:56px;border-radius:50%; background:#e6f4ea; color:var(--success); display:flex;align-items:center;justify-content:center; margin:0 auto 20px; font-size:28px; }
  .done-screen h2{ margin:0 0 8px; font-size:20px; }
  .done-screen p{ color:var(--muted); font-size:14px; }
  .again-btn{ margin-top:20px; background:none; border:1px solid var(--border); padding:8px 18px; border-radius:6px; cursor:pointer; color:var(--purple); font-size:13px; }
  .hidden{ display:none !important; }
  .setup-warning{ background:#fff3cd; border:1px solid #ffe69c; color:#7a5b00; padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:16px; }
</style>
</head>
<body>

<div class="wrap">

  <div id="setupWarning" class="setup-warning hidden">
    ⚠️ 아직 Google Apps Script 웹 앱 URL이 연결되지 않았습니다. 이 HTML 파일 하단의 <code>SCRIPT_URL</code> 값을 본인의 배포 URL로 바꿔주세요.
  </div>

  <div id="formScreen">
    <div class="header-bar"></div>
    <div class="card title-card">
      <h1>개인정보 입력</h1>
      <p class="desc">자신의 개인정보를 입력하세요.<br>아래 항목을 순서대로 작성한 뒤 제출해 주세요.</p>
    </div>

    <div class="field-card" id="nameCard">
      <label class="field-label">이름 <span class="req">*</span></label>
      <input type="text" id="nameInput" placeholder="답을 입력하세요" />
      <div class="error-msg">이름을 입력해 주세요.</div>
    </div>

    <div class="field-card" id="birthCard">
      <label class="field-label">생년월일 <span class="req">*</span></label>
      <div class="date-row">
        <select id="yearSelect"></select>
        <select id="monthSelect"></select>
        <select id="daySelect"></select>
      </div>
      <div class="date-labels"><span>연도</span><span>월</span><span>일</span></div>
      <div class="error-msg">생년월일을 모두 선택해 주세요.</div>
    </div>

    <div class="field-card" id="phoneCard">
      <label class="field-label">휴대전화번호 <span class="req">*</span></label>
      <input type="tel" id="phoneInput" placeholder="답을 입력하세요" />
      <div class="error-msg">휴대전화번호를 입력해 주세요.</div>
    </div>

    <div class="submit-row">
      <span class="status-msg" id="statusMsg"></span>
      <button class="submit-btn" id="submitBtn" onclick="submitForm()">제출</button>
    </div>
  </div>

  <div id="doneScreen" class="card done-screen hidden">
    <div class="check">✓</div>
    <h2>제출이 완료되었습니다</h2>
    <p>정보가 정상적으로 전송되었습니다.</p>
    <button class="again-btn" onclick="resetForm()">다시 작성하기</button>
  </div>

</div>

<script>
  // ⬇️⬇️⬇️ 여기에 본인의 Google Apps Script 웹 앱 URL을 붙여넣으세요 ⬇️⬇️⬇️
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9Y9hrPdQmNjSPR5tODjqT-f6e0etsWR9t6nCeKcIBB78RujJthdwRdJqJZ8C9UzITLw/exec";
  // 예: const SCRIPT_URL = "https://script.google.com/macros/s/AKfycb.../exec";
  // (이 폼은 이름, 생년월일, 휴대전화번호 3개 항목만 전송합니다.)

  if (!SCRIPT_URL || SCRIPT_URL.indexOf('script.google.com') === -1) {
    document.getElementById('setupWarning').classList.remove('hidden');
  }

  const yearSelect = document.getElementById('yearSelect');
  const monthSelect = document.getElementById('monthSelect');
  const daySelect = document.getElementById('daySelect');

  function fillSelect(el, start, end, placeholder){
    const optDefault = document.createElement('option');
    optDefault.value = '';
    optDefault.textContent = placeholder;
    el.appendChild(optDefault);
    for(let i=start;i<=end;i++){
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i;
      el.appendChild(opt);
    }
  }
  fillSelect(yearSelect, 2005, 2010, '연도');
  fillSelect(monthSelect, 1, 12, '월');
  fillSelect(daySelect, 1, 31, '일');

  function pad2(n){ return String(n).padStart(2,'0'); }

  function clearInvalid(){
    document.querySelectorAll('.field-card').forEach(c=>c.classList.remove('invalid'));
  }

  function validate(){
    clearInvalid();
    let ok = true;
    const name = document.getElementById('nameInput').value.trim();
    const phone = document.getElementById('phoneInput').value.trim();
    const y = yearSelect.value, m = monthSelect.value, d = daySelect.value;

    if(!name){ document.getElementById('nameCard').classList.add('invalid'); ok = false; }
    if(!y || !m || !d){ document.getElementById('birthCard').classList.add('invalid'); ok = false; }
    if(!phone){ document.getElementById('phoneCard').classList.add('invalid'); ok = false; }
    return ok;
  }

  async function submitForm(){
    if(!validate()) return;

    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    submitBtn.disabled = true;
    statusMsg.textContent = '제출 중...';

    const data = {
      name: document.getElementById('nameInput').value.trim(),
      birth: `${yearSelect.value}-${pad2(monthSelect.value)}-${pad2(daySelect.value)}`,
      phone: document.getElementById('phoneInput').value.trim()
    };

    try{
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });
      document.getElementById('formScreen').classList.add('hidden');
      document.getElementById('doneScreen').classList.remove('hidden');
    }catch(err){
      console.error(err);
      statusMsg.textContent = '제출 중 오류가 발생했습니다. 다시 시도해 주세요.';
    }finally{
      submitBtn.disabled = false;
    }
  }

  function resetForm(){
    document.getElementById('nameInput').value = '';
    document.getElementById('phoneInput').value = '';
    yearSelect.value = ''; monthSelect.value = ''; daySelect.value = '';
    clearInvalid();
    document.getElementById('statusMsg').textContent = '';
    document.getElementById('doneScreen').classList.add('hidden');
    document.getElementById('formScreen').classList.remove('hidden');
  }
</script>
</body>
</html>
